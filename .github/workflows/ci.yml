name: Credential-free contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate JSON schema syntax
        run: python3 -m json.tool schema/release-manifest.schema.json >/dev/null

      - name: Require GnuPG verification tools
        run: |
          command -v gpg >/dev/null
          command -v gpgv >/dev/null

      - name: Run dependency-free contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Audit secrets, paths, permissions, and immutable action references
        run: python3 scripts/audit_repository.py

      - name: Install checksum-pinned actionlint
        run: scripts/install_actionlint.sh /tmp/xr-actionlint

      - name: Validate GitHub Actions syntax and semantics
        run: /tmp/xr-actionlint/actionlint -color

  fixture:
    name: Fixture DEB (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            wrong_architecture: arm64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            wrong_architecture: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build a minimal auditable DEB
        run: >-
          python3 scripts/build_fixture_deb.py
          --architecture '${{ matrix.architecture }}'
          --output fixture-out

      - name: Accept the exact package contract
        run: >-
          python3 scripts/validate_debs.py
          --directory fixture-out
          --packages-json '["xr-release-fixture"]'
          --version 1.2.3
          --architecture '${{ matrix.architecture }}'
          --checksums-out 'fixture-out/SHA256SUMS.${{ matrix.architecture }}'

      - name: Reject a wrong Architecture
        run: |
          if python3 scripts/validate_debs.py \
            --directory fixture-out \
            --packages-json '["xr-release-fixture"]' \
            --version 1.2.3 \
            --architecture '${{ matrix.wrong_architecture }}' \
            --checksums-out /tmp/should-not-exist; then
            echo 'wrong Architecture was accepted' >&2
            exit 1
          fi

      - name: Reject a wrong version
        run: |
          if python3 scripts/validate_debs.py \
            --directory fixture-out \
            --packages-json '["xr-release-fixture"]' \
            --version 9.9.9 \
            --architecture '${{ matrix.architecture }}' \
            --checksums-out /tmp/should-not-exist; then
            echo 'wrong version was accepted' >&2
            exit 1
          fi

      - name: Reject an empty artifact directory
        run: |
          mkdir empty-out
          if python3 scripts/validate_debs.py \
            --directory empty-out \
            --packages-json '["xr-release-fixture"]' \
            --version 1.2.3 \
            --architecture '${{ matrix.architecture }}' \
            --checksums-out /tmp/should-not-exist; then
            echo 'empty artifact directory was accepted' >&2
            exit 1
          fi

      - name: Preserve the credential-free fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fixture-${{ matrix.architecture }}
          path: fixture-out/
          if-no-files-found: error
          retention-days: 3

  aggregate:
    name: Aggregate release contract
    needs: fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download both architecture fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: fixture-*
          path: fixture-release
          merge-multiple: true

      - name: Accept the complete two-architecture release
        run: >-
          python3 scripts/validate_release.py
          --directory fixture-release
          --packages-json '["xr-release-fixture"]'
          --version 1.2.3
          --checksums-out fixture-release/SHA256SUMS

      - name: Reject a checksum mismatch
        run: |
          python3 -c "from pathlib import Path; Path('fixture-release/SHA256SUMS.amd64').write_text('0' * 64 + '  xr-release-fixture_1.2.3_amd64.deb\\n')"
          if python3 scripts/validate_release.py \
            --directory fixture-release \
            --packages-json '["xr-release-fixture"]' \
            --version 1.2.3 \
            --checksums-out /tmp/should-not-exist; then
            echo 'checksum mismatch was accepted' >&2
            exit 1
          fi
