name: Reusable Linux DEB release

on:
  workflow_call:
    inputs:
      workflow_implementation_commit:
        description: Exact 40-character commit containing this reusable workflow implementation
        required: true
        type: string
      source_repository:
        description: Private source repository in OWNER/REPOSITORY form
        required: true
        type: string
      source_tag:
        description: Existing exact v-prefixed source tag
        required: true
        type: string
      source_commit:
        description: Lowercase 40-character commit SHA resolved by the source dispatcher
        required: true
        type: string
      source_manifest_path:
        description: Repository-relative path to the v1 release manifest
        required: true
        type: string
      apt_repository_url:
        description: HTTP(S) APT repository base URL without credentials
        required: true
        type: string
      apt_allow_plain_http:
        description: Explicitly accept plaintext HTTP transport risk for this publication
        required: false
        default: false
        type: boolean
      apt_distribution:
        description: APT distribution or suite
        required: true
        type: string
      apt_component:
        description: APT component
        required: true
        type: string
      apt_signing_key_url:
        description: GitHub HTTPS raw URL pinned to the commit containing the public signing key
        required: true
        type: string
      apt_signing_key_fingerprint:
        description: Full uppercase fingerprint of the expected APT signing key
        required: true
        type: string
      prerelease:
        description: Publish the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean
      apt_index_timeout_seconds:
        description: Maximum wait for APT index convergence
        required: false
        default: 180
        type: number
    secrets:
      XR_PRIVATE_SOURCE_TOKEN:
        description: Optional Contents-read token scoped to the exact private source repository
        required: false
      XR_PRIVATE_SOURCE_SSH_KEY:
        description: Optional read-only Deploy Key for the exact private source repository
        required: false
      XR_APT_REPO_USER:
        description: APT upload username supplied by the caller
        required: true
      XR_APT_REPO_PASS:
        description: APT upload password supplied by the caller
        required: true

permissions: {}

concurrency:
  group: xr-linux-deb-release-${{ github.repository }}-${{ inputs.source_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate source release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.source.outputs.matrix }}
      packages: ${{ steps.source.outputs.packages }}
      build_script: ${{ steps.source.outputs.build_script }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Require an immutable workflow implementation commit
        env:
          WORKFLOW_IMPLEMENTATION_COMMIT: ${{ inputs.workflow_implementation_commit }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_IMPLEMENTATION_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "workflow_implementation_commit must be a lowercase 40-character commit" >&2
            exit 2
          }

      - name: Check out the immutable workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xr-esp-private/xr-release-workflows
          ref: ${{ inputs.workflow_implementation_commit }}
          path: .xr-release-workflows
          persist-credentials: false

      - name: Reject unsafe or incomplete caller inputs before private checkout
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_MANIFEST_PATH: ${{ inputs.source_manifest_path }}
          APT_REPOSITORY_URL: ${{ inputs.apt_repository_url }}
          APT_DISTRIBUTION: ${{ inputs.apt_distribution }}
          APT_COMPONENT: ${{ inputs.apt_component }}
          APT_SIGNING_KEY_URL: ${{ inputs.apt_signing_key_url }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ inputs.apt_signing_key_fingerprint }}
          APT_ALLOW_PLAIN_HTTP: ${{ inputs.apt_allow_plain_http }}
        run: |
          set -euo pipefail
          args=(
            --source-repository "$SOURCE_REPOSITORY"
            --source-tag "$SOURCE_TAG"
            --source-commit "$SOURCE_COMMIT"
            --manifest-path "$SOURCE_MANIFEST_PATH"
            --apt-repository-url "$APT_REPOSITORY_URL"
            --apt-distribution "$APT_DISTRIBUTION"
            --apt-component "$APT_COMPONENT"
            --apt-signing-key-url "$APT_SIGNING_KEY_URL"
            --apt-signing-key-fingerprint "$APT_SIGNING_KEY_FINGERPRINT"
          )
          if [ "$APT_ALLOW_PLAIN_HTTP" = true ]; then
            args+=(--apt-allow-plain-http)
          fi
          python3 .xr-release-workflows/scripts/validate_dispatch.py "${args[@]}"

      - name: Bootstrap the pinned APT signing key before private checkout
        env:
          APT_REPOSITORY_URL: ${{ inputs.apt_repository_url }}
          APT_DISTRIBUTION: ${{ inputs.apt_distribution }}
          APT_COMPONENT: ${{ inputs.apt_component }}
          APT_ALLOW_PLAIN_HTTP: ${{ inputs.apt_allow_plain_http }}
          APT_SIGNING_KEY_URL: ${{ inputs.apt_signing_key_url }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ inputs.apt_signing_key_fingerprint }}
        run: |
          set -euo pipefail
          args=(
            --repository-url "$APT_REPOSITORY_URL"
            --distribution "$APT_DISTRIBUTION"
            --component "$APT_COMPONENT"
            --key-url "$APT_SIGNING_KEY_URL"
            --fingerprint "$APT_SIGNING_KEY_FINGERPRINT"
          )
          if [ "$APT_ALLOW_PLAIN_HTTP" = true ]; then
            args+=(--allow-plain-http)
          fi
          python3 .xr-release-workflows/scripts/validate_apt_trust.py "${args[@]}"

      - name: Require exactly one private source credential
        id: source-auth
        env:
          TOKEN_CONFIGURED: ${{ secrets.XR_PRIVATE_SOURCE_TOKEN != '' }}
          SSH_KEY_CONFIGURED: ${{ secrets.XR_PRIVATE_SOURCE_SSH_KEY != '' }}
        run: >-
          python3 .xr-release-workflows/scripts/validate_source_auth.py
          --token-configured "$TOKEN_CONFIGURED"
          --ssh-key-configured "$SSH_KEY_CONFIGURED"
          --github-output "$GITHUB_OUTPUT"

      - name: Check out the exact private source tag with the read-only token
        if: steps.source-auth.outputs.mode == 'token'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.source_repository }}
          ref: refs/tags/${{ inputs.source_tag }}
          token: ${{ secrets.XR_PRIVATE_SOURCE_TOKEN }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Check out the exact private source tag with the read-only Deploy Key
        if: steps.source-auth.outputs.mode == 'ssh'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.source_repository }}
          ref: refs/tags/${{ inputs.source_tag }}
          ssh-key: ${{ secrets.XR_PRIVATE_SOURCE_SSH_KEY }}
          ssh-strict: true
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Bind source tag, commit, manifest, and release notes
        id: source
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_MANIFEST_PATH: ${{ inputs.source_manifest_path }}
        run: |
          python3 .xr-release-workflows/scripts/prepare_source.py \
            --source-dir source \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-tag "$SOURCE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --manifest-path "$SOURCE_MANIFEST_PATH" \
            --metadata-dir release-metadata \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve validated public release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and test (${{ matrix.architecture }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the immutable workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xr-esp-private/xr-release-workflows
          ref: ${{ inputs.workflow_implementation_commit }}
          path: .xr-release-workflows
          persist-credentials: false

      - name: Require exactly one private source credential
        id: source-auth
        env:
          TOKEN_CONFIGURED: ${{ secrets.XR_PRIVATE_SOURCE_TOKEN != '' }}
          SSH_KEY_CONFIGURED: ${{ secrets.XR_PRIVATE_SOURCE_SSH_KEY != '' }}
        run: >-
          python3 .xr-release-workflows/scripts/validate_source_auth.py
          --token-configured "$TOKEN_CONFIGURED"
          --ssh-key-configured "$SSH_KEY_CONFIGURED"
          --github-output "$GITHUB_OUTPUT"

      - name: Check out the exact private source tag with the read-only token
        if: steps.source-auth.outputs.mode == 'token'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.source_repository }}
          ref: refs/tags/${{ inputs.source_tag }}
          token: ${{ secrets.XR_PRIVATE_SOURCE_TOKEN }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Check out the exact private source tag with the read-only Deploy Key
        if: steps.source-auth.outputs.mode == 'ssh'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.source_repository }}
          ref: refs/tags/${{ inputs.source_tag }}
          ssh-key: ${{ secrets.XR_PRIVATE_SOURCE_SSH_KEY }}
          ssh-strict: true
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Recheck exact source commit
        working-directory: source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse 'HEAD^{commit}')
          test "$actual" = "$EXPECTED_SOURCE_COMMIT"

      - name: Run the product-owned build and test entrypoint
        working-directory: source
        env:
          XR_RELEASE_ARCH: ${{ matrix.architecture }}
          XR_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          XR_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/source/release-out
          XR_RELEASE_BUILD_SCRIPT: ${{ needs.prepare.outputs.build_script }}
        run: |
          set -euo pipefail
          test -f "$XR_RELEASE_BUILD_SCRIPT"
          test ! -L "$XR_RELEASE_BUILD_SCRIPT"
          bash "$XR_RELEASE_BUILD_SCRIPT"

      - name: Validate package count, identity, version, architecture, and bytes
        env:
          PACKAGES_JSON: ${{ needs.prepare.outputs.packages }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 .xr-release-workflows/scripts/validate_debs.py \
            --directory source/release-out \
            --packages-json "$PACKAGES_JSON" \
            --version "$RELEASE_VERSION" \
            --architecture "$RELEASE_ARCHITECTURE" \
            --checksums-out "source/release-out/SHA256SUMS.$RELEASE_ARCHITECTURE"

      - name: Upload validated architecture artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debs-${{ matrix.architecture }}
          path: |
            source/release-out/*.deb
            source/release-out/SHA256SUMS.${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft, publish to APT, verify, and release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the immutable workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xr-esp-private/xr-release-workflows
          ref: ${{ inputs.workflow_implementation_commit }}
          path: .xr-release-workflows
          persist-credentials: false

      - name: Download validated release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-metadata
          path: release-metadata

      - name: Download all validated DEB artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: debs-*
          path: dist
          merge-multiple: true

      - name: Validate the complete two-architecture release
        env:
          PACKAGES_JSON: ${{ needs.prepare.outputs.packages }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 .xr-release-workflows/scripts/validate_release.py \
            --directory dist \
            --packages-json "$PACKAGES_JSON" \
            --version "$RELEASE_VERSION" \
            --checksums-out dist/SHA256SUMS

      - name: Create or verify a byte-identical draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_COMMIT: ${{ github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            prepare
            --dist dist
            --metadata release-metadata
            --notes release-metadata/release-notes.md
            --tag "$SOURCE_TAG"
            --target-commit "$TARGET_COMMIT"
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          python3 .xr-release-workflows/scripts/github_release.py "${args[@]}"

      - name: Strictly upload to APT and verify signed indexes and SHA-256
        env:
          XR_APT_REPO_USER: ${{ secrets.XR_APT_REPO_USER }}
          XR_APT_REPO_PASS: ${{ secrets.XR_APT_REPO_PASS }}
          APT_ALLOW_PLAIN_HTTP: ${{ inputs.apt_allow_plain_http }}
          APT_REPOSITORY_URL: ${{ inputs.apt_repository_url }}
          APT_DISTRIBUTION: ${{ inputs.apt_distribution }}
          APT_COMPONENT: ${{ inputs.apt_component }}
          APT_INDEX_TIMEOUT_SECONDS: ${{ inputs.apt_index_timeout_seconds }}
          APT_SIGNING_KEY_URL: ${{ inputs.apt_signing_key_url }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ inputs.apt_signing_key_fingerprint }}
        run: |
          set -euo pipefail
          args=(
            --directory dist
            --repository-url "$APT_REPOSITORY_URL"
            --distribution "$APT_DISTRIBUTION"
            --component "$APT_COMPONENT"
            --poll-timeout "$APT_INDEX_TIMEOUT_SECONDS"
            --signing-key-url "$APT_SIGNING_KEY_URL"
            --signing-key-fingerprint "$APT_SIGNING_KEY_FINGERPRINT"
          )
          if [ "$APT_ALLOW_PLAIN_HTTP" = true ]; then
            args+=(--allow-plain-http)
          fi
          python3 .xr-release-workflows/scripts/apt_publish.py "${args[@]}"

      - name: Publish the GitHub Release only after APT verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: >-
          python3 .xr-release-workflows/scripts/github_release.py finalize
          --tag "$SOURCE_TAG"
